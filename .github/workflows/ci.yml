name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: 정적 검사 · 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 카탈로그 생성 파일 동기화 검사
        run: python tools/build_korean_catalog.py --check

      - name: 단일 HTML 최신 여부 검사
        run: python tools/build_single.py --check

      - name: Python 도구 문법 검사
        run: python -m compileall -q tools

      - name: 카탈로그 데이터 검사
        run: python tools/check_korean_catalog.py

      - name: 백업 검사기 양성/음성 케이스
        run: |
          python tools/check_backup.py tests/fixtures/backup-valid.json
          if python tools/check_backup.py tests/fixtures/backup-invalid.json; then
            echo "음성 케이스가 통과하면 안 됩니다."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 문법 검사
        run: npm run check

      - name: 단위 테스트
        run: npm test

      - name: 클라이언트에 JWT 비밀키 흔적이 없는지 검사
        run: |
          if grep -rInE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.' \
            --include='*.js' --include='*.html' --include='*.json' .; then
            echo "JWT 형태의 문자열이 클라이언트 파일에 있습니다. service_role 키 여부를 확인하세요."
            exit 1
          fi

  browser:
    name: 브라우저 스모크 (초기 스켈레톤)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright 설치
        timeout-minutes: 15
        run: |
          npm install --no-save @playwright/test
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright 설치 실패 (시도 ${attempt}/3). 15초 후 재시도합니다."
            sleep 15
          done
          exit 1

      - name: 스모크 테스트
        shell: bash
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee /tmp/playwright.log

      - name: 실패 로그 요약
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          path = '/tmp/playwright.log'
          text = open(path, encoding='utf-8', errors='replace').read() if os.path.exists(path) else 'no log'
          head = text.split('Browser logs:')[0]
          marker = 'Call log:'
          tail = text.split(marker, 1)[1] if marker in text else ''
          message = (head + '\n' + marker + '\n' + tail).strip()[-3500:]
          message = message.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print(f'::error title=Playwright failure::{message}')
          PY
