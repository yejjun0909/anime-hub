<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ANIME HUB — 동기화 큐 테스트</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #11131b; color: #e8eaf2; }
    #summary { padding: 12px 16px; border-radius: 8px; background: #1c2030; font-weight: 700; }
    #summary.pass { color: #7ef0a8; }
    #summary.fail { color: #ff8f8f; }
    ul { font-size: 13px; }
    li.fail { color: #ff8f8f; }
  </style>
</head>
<body>
  <h1>동기화 큐 테스트</h1>
  <div id="summary">실행 중…</div>
  <ul id="rows"></ul>
  <script type="module">
    import { readQueue, writeQueue, enqueue, dequeue, markAttempt, pendingCount } from '../data/sync-queue.js';
    const rows = document.getElementById('rows');
    const summary = document.getElementById('summary');
    const failures = [];
    let total = 0;
    function check(name, condition) {
      total += 1;
      const li = document.createElement('li');
      if (!condition) { li.className = 'fail'; failures.push(name); }
      li.textContent = (condition ? '통과' : '실패') + ' — ' + name;
      rows.appendChild(li);
    }
    try {
      const storage = { _s: new Map(), getItem(k){return this._s.has(k)?this._s.get(k):null;}, setItem(k,v){this._s.set(k,String(v));}, removeItem(k){this._s.delete(k);} };
      let queue = readQueue(storage);
      const { queue: q1, entry } = enqueue(queue, { type: 'upsert', payload: { media_id: 1 } });
      check('enqueue 길이', q1.length === 1);
      check('enqueue 타입', entry.type === 'upsert');
      writeQueue(q1, storage);
      check('write/read', readQueue(storage).length === 1);
      const q2 = dequeue(q1, entry.mutation_id);
      check('dequeue 길이', q2.length === 0);
      writeQueue(q2, storage);
      check('pendingCount', pendingCount(readQueue(storage)) === 0);
      const { queue: q3 } = enqueue([], { type: 'delete', payload: { media_id: 2 } });
      const marked = markAttempt(q3, q3[0].mutation_id);
      check('markAttempt', marked[0].attempts === 1);
      check('storage 없음 안전', Array.isArray(readQueue(null)) && writeQueue([{ a: 1 }], null) === false);
      summary.className = failures.length ? 'fail' : 'pass';
      summary.textContent = failures.length ? `실패 ${failures.length}건 / 전체 ${total}건` : `통과 ${total}건 / 전체 ${total}건`;
      window.__SYNC_QUEUE_RESULT__ = { total, failed: failures.length, failures };
      document.title = failures.length ? `FAIL ${failures.length}/${total}` : `PASS ${total}/${total}`;
    } catch (e) {
      summary.className = 'fail';
      summary.textContent = `실행 오류: ${e.message}`;
      window.__SYNC_QUEUE_RESULT__ = { total, failed: 1, failures: [e.message] };
      document.title = 'ERROR';
    }
  </script>
</body>
</html>
