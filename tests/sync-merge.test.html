<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ANIME HUB — 동기화 병합 테스트</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #11131b; color: #e8eaf2; }
    #summary { padding: 12px 16px; border-radius: 8px; background: #1c2030; font-weight: 700; }
    #summary.pass { color: #7ef0a8; }
    #summary.fail { color: #ff8f8f; }
    ul { font-size: 13px; }
    li.fail { color: #ff8f8f; }
  </style>
</head>
<body>
  <h1>동기화 병합 테스트</h1>
  <div id="summary">실행 중…</div>
  <ul id="rows"></ul>
  <script type="module">
    import { diffWatchlist, mergeWatchlistWithConflicts } from '../data/sync-merge.js';
    const rows = document.getElementById('rows');
    const summary = document.getElementById('summary');
    const failures = [];
    let total = 0;
    function check(name, condition) {
      total += 1;
      const li = document.createElement('li');
      if (!condition) { li.className = 'fail'; failures.push(name); }
      li.textContent = (condition ? '통과' : '실패') + ' — ' + name;
      rows.appendChild(li);
    }
    try {
      const local = [{ media_id: 1, status: 'CURRENT', updated_at: '2026-11-03T10:00:00Z' }, { media_id: 2, status: 'COMPLETED', updated_at: '2026-11-03T10:00:00Z', deleted_at: '2026-11-03T10:00:00Z' }];
      const remote = [{ media_id: 1, status: 'COMPLETED', updated_at: '2026-11-03T11:00:00Z' }, { media_id: 3, status: 'PLANNING', updated_at: '2026-11-03T09:00:00Z' }];
      const diff = diffWatchlist(local, remote);
      check('변경 1건', diff.changed.length === 1 && diff.changed[0].winner === 'remote');
      check('추가 1건', diff.added.length === 1);
      check('삭제 1건', diff.removed.length === 1);
      const tomb = mergeWatchlistWithConflicts(
        [{ media_id: 1, status: 'CURRENT', updated_at: '2026-11-03T10:00:00Z' }],
        [{ media_id: 1, status: 'CURRENT', updated_at: '2026-11-03T09:00:00Z', deleted_at: '2026-11-03T09:30:00Z' }]
      );
      check('tombstone 삭제 우선', tomb.merged.length === 0);
      const conflict = mergeWatchlistWithConflicts(
        [{ media_id: 1, status: 'CURRENT', updated_at: '2026-11-03T10:00:00.000Z' }],
        [{ media_id: 1, status: 'COMPLETED', updated_at: '2026-11-03T10:00:00.000Z' }]
      );
      check('충돌 감지', conflict.conflicts.length === 1);
      check('빈 입력', mergeWatchlistWithConflicts([], []).merged.length === 0);
      summary.className = failures.length ? 'fail' : 'pass';
      summary.textContent = failures.length ? `실패 ${failures.length}건 / 전체 ${total}건` : `통과 ${total}건 / 전체 ${total}건`;
      window.__SYNC_MERGE_RESULT__ = { total, failed: failures.length, failures };
      document.title = failures.length ? `FAIL ${failures.length}/${total}` : `PASS ${total}/${total}`;
    } catch (e) {
      summary.className = 'fail';
      summary.textContent = `실행 오류: ${e.message}`;
      window.__SYNC_MERGE_RESULT__ = { total, failed: 1, failures: [e.message] };
      document.title = 'ERROR';
    }
  </script>
</body>
</html>
