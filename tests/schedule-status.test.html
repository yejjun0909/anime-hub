<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ANIME HUB — 방영 일정 상태 테스트</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #11131b; color: #e8eaf2; }
    #summary { padding: 12px 16px; border-radius: 8px; background: #1c2030; font-weight: 700; }
    #summary.pass { color: #7ef0a8; }
    #summary.fail { color: #ff8f8f; }
    ul { font-size: 13px; }
    li.fail { color: #ff8f8f; }
  </style>
</head>
<body>
  <h1>방영 일정 상태 테스트</h1>
  <div id="summary">실행 중…</div>
  <ul id="rows"></ul>
  <script type="module">
    import { classifyAiring, readAiringBaseline, writeAiringBaseline, AIRING_STATE } from '../data/schedule-status.js';
    const rows = document.getElementById('rows');
    const summary = document.getElementById('summary');
    const failures = [];
    let total = 0;
    function check(name, condition, detail = '') {
      total += 1;
      const li = document.createElement('li');
      if (!condition) { li.className = 'fail'; failures.push(name); }
      li.textContent = (condition ? '통과' : '실패') + ' — ' + name + (detail ? ` [${detail}]` : '');
      rows.appendChild(li);
    }
    try {
      const now = 1700000000;
      check('취소', classifyAiring({ media: { status: 'CANCELLED' }, nextAiringEpisode: { airingAt: now + 1000, episode: 5 } }, now).state === AIRING_STATE.CANCELLED);
      check('특별편', classifyAiring({ media: { status: 'RELEASING' }, nextAiringEpisode: { airingAt: now + 1000, episode: 0 } }, now).state === AIRING_STATE.SPECIAL);
      check('지난 예정', classifyAiring({ media: { status: 'RELEASING' }, nextAiringEpisode: { airingAt: now - 3600, episode: 5 } }, now).state === AIRING_STATE.PAST);
      check('지연 의심', classifyAiring({ media: { id: 1, status: 'RELEASING' }, nextAiringEpisode: { airingAt: now + 3600, episode: 5 } }, now, { airingAt: now - 100000, episode: 5 }).state === AIRING_STATE.DELAYED);
      check('미방영 의심', classifyAiring({ media: { id: 1, status: 'RELEASING' }, nextAiringEpisode: { airingAt: now - 25*3600, episode: 5 } }, now, { airingAt: now - 26*3600, episode: 5 }).state === AIRING_STATE.MISSED);
      check('결방 의심', classifyAiring({ media: { status: 'HIATUS' }, nextAiringEpisode: { airingAt: now + 3600, episode: 5 } }, now).state === AIRING_STATE.HIATUS);
      check('방영 예정', classifyAiring({ media: { status: 'RELEASING' }, nextAiringEpisode: { airingAt: now + 3600, episode: 5 } }, now).label === '방영 예정');
      const storage = { _s: new Map(), getItem(k){return this._s.has(k)?this._s.get(k):null;}, setItem(k,v){this._s.set(k,String(v));}, removeItem(k){this._s.delete(k);} };
      check('baseline round trip', (() => { writeAiringBaseline([{ media: { id: 1 }, nextAiringEpisode: { airingAt: 100, episode: 2 } }], storage, now); const b = readAiringBaseline(storage); return b['1'] && b['1'].episode === 2; })());
      check('storage 없음 안전', readAiringBaseline(null) !== null && Object.keys(readAiringBaseline(null)).length === 0);
      summary.className = failures.length ? 'fail' : 'pass';
      summary.textContent = failures.length ? `실패 ${failures.length}건 / 전체 ${total}건` : `통과 ${total}건 / 전체 ${total}건`;
      window.__STATUS_RESULT__ = { total, failed: failures.length, failures };
      document.title = failures.length ? `FAIL ${failures.length}/${total}` : `PASS ${total}/${total}`;
    } catch (error) {
      summary.className = 'fail';
      summary.textContent = `실행 오류: ${error.message}`;
      window.__STATUS_RESULT__ = { total, failed: 1, failures: [error.message] };
      document.title = 'ERROR';
    }
  </script>
</body>
</html>
