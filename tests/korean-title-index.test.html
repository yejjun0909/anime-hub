<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>애니허브 — 한국어 제목 인덱스 테스트</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #11131b; color: #e8eaf2; }
    h1 { font-size: 20px; }
    #summary { font-size: 16px; font-weight: 700; padding: 12px 16px; border-radius: 8px; background: #1c2030; }
    #summary.pass { color: #7ef0a8; }
    #summary.fail { color: #ff8f8f; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; font-size: 13px; }
    th, td { border-bottom: 1px solid #2a3044; padding: 8px; text-align: left; vertical-align: top; }
    tr.fail td { background: #3a1c22; }
    code { color: #9fc4ff; }
  </style>
</head>
<body>
  <h1>한국어 제목 인덱스 테스트</h1>
  <p>실제 앱이 사용하는 <code>data/korean-title-index.js</code> 모듈로 실행합니다.</p>
  <div id="summary">실행 중…</div>
  <table>
    <thead><tr><th>#</th><th>케이스</th><th>기대</th><th>실제</th><th>결과</th><th>이유</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module">
    import { KOREAN_TITLE_INDEX, findKoreanTitleEntry, normalizeTitleKey } from '../data/korean-title-index.js';

    const rows = document.getElementById('rows');
    const summary = document.getElementById('summary');
    const failures = [];
    let index = 0;

    function check(name, expected, actual, why) {
      index += 1;
      const passed = JSON.stringify(expected) === JSON.stringify(actual);
      const tr = document.createElement('tr');
      if (!passed) tr.className = 'fail';
      tr.innerHTML = `<td>${index}</td><td>${name}</td><td><code>${JSON.stringify(expected)}</code></td>` +
        `<td><code>${JSON.stringify(actual)}</code></td><td>${passed ? '통과' : '실패'}</td><td>${why}</td>`;
      rows.appendChild(tr);
      if (!passed) failures.push({ name, expected, actual, why });
    }

    try {
      const entries = Object.entries(KOREAN_TITLE_INDEX);

      check('인덱스 규모', true, entries.length >= 100, '최소 100개 이상의 한국어 제목을 포함해야 합니다.');
      check('모든 항목에 searchTerm', true, entries.every(([, v]) => typeof v.searchTerm === 'string' && v.searchTerm.length > 0), '네트워크 질의어가 비면 안 됩니다.');
      check('모든 항목에 MAL ID', true, entries.every(([, v]) => Number.isInteger(v.malId) && v.malId > 0), 'MAL ID는 양의 정수.');
      check('모든 항목에 AniList ID', true, entries.every(([, v]) => /^\d+$/.test(String(v.anilistId))), 'AniList ID 문자열.');

      const mononoke = findKoreanTitleEntry('원령공주');
      check('정확 매칭: 원령공주', 164, mononoke?.malId, 'MAL ID 164.');
      check('정확 매칭: 검색어', 'Princess Mononoke', mononoke?.searchTerm, '영어 제목 우선.');
      check('정확 매칭: 로마자', 'Mononoke-hime', mononoke?.romaji, '로마자 제목 보존.');

      const titan = findKoreanTitleEntry('진격의 거인');
      check('정확 매칭: 진격의 거인', 16498, titan?.malId, 'MAL ID 16498.');

      const fuzzyTitan = findKoreanTitleEntry('진격거인');
      check('퍼지 매칭: 진격거인', 16498, fuzzyTitan?.malId, '띄어쓰기·조사 누락을 허용.');

      const season = findKoreanTitleEntry('귀멸의 칼날 시즌2');
      check('시즌 표기 제거 매칭', '귀멸의 칼날', season?.title, '시즌 숫자는 비교에서 제외.');

      const punctuation = findKoreanTitleEntry('Re:제로부터 시작하는 이세계 생활');
      check('기호 포함 제목 매칭', 31240, punctuation?.malId, '콜론/공백 차이를 무시.');

      check('무관한 검색어', null, findKoreanTitleEntry('zzzzqqqqxxxx'), '임계값 미만은 null.');
      check('빈 검색어', null, findKoreanTitleEntry('   '), '빈 문자열은 null.');
      check('null 검색어', null, findKoreanTitleEntry(null), 'null 안전.');

      check('normalize: 공백/기호 제거', '귀멸의칼날', normalizeTitleKey('귀멸의 칼날'), '비교 키 정규화.');
      check('normalize: 시즌 숫자 제거', '귀멸의칼날', normalizeTitleKey('귀멸의 칼날 시즌 3'), '시즌N 제거.');
      check('normalize: 영문 season 제거', 'demonslayer', normalizeTitleKey('Demon Slayer season 2'), 'seasonN 제거.');

      const failed = failures.length;
      summary.className = failed ? 'fail' : 'pass';
      summary.textContent = failed
        ? `실패 ${failed}건 / 전체 ${index}건`
        : `통과 ${index}건 / 전체 ${index}건`;
      window.__KOREAN_TITLE_INDEX_RESULT__ = { total: index, failed, entries: entries.length, failures, finishedAt: new Date().toISOString() };
      document.title = failed ? `FAIL ${failed}/${index}` : `PASS ${index}/${index}`;
    } catch (error) {
      summary.className = 'fail';
      summary.textContent = `실행 오류: ${error.message}`;
      window.__KOREAN_TITLE_INDEX_RESULT__ = { total: index, failed: failures.length + 1, failures: [{ name: 'harness', detail: error.message }] };
      document.title = 'ERROR';
    }
  </script>
</body>
</html>
