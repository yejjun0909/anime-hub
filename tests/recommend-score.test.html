<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ANIME HUB — 추천 점수 테스트</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #11131b; color: #e8eaf2; }
    #summary { padding: 12px 16px; border-radius: 8px; background: #1c2030; font-weight: 700; }
    #summary.pass { color: #7ef0a8; }
    #summary.fail { color: #ff8f8f; }
    ul { font-size: 13px; }
    li.fail { color: #ff8f8f; }
  </style>
</head>
<body>
  <h1>추천 점수 테스트</h1>
  <div id="summary">실행 중…</div>
  <ul id="rows"></ul>
  <script type="module">
    import { computeCandidateScore, rankCandidates, selectDiverse, recommendationMetrics } from '../data/recommend-score.js';
    const rows = document.getElementById('rows');
    const summary = document.getElementById('summary');
    const failures = [];
    let total = 0;
    function check(name, condition) {
      total += 1;
      const li = document.createElement('li');
      if (!condition) { li.className = 'fail'; failures.push(name); }
      li.textContent = (condition ? '통과' : '실패') + ' — ' + name;
      rows.appendChild(li);
    }
    try {
      const profile = { genre: new Map([['Action',5],['Fantasy',3]]), disliked: new Map(), format: new Map([['TV',4]]), studio: new Map([['ufotable',2]]), positiveGenreTotal: 8, dislikedGenreTotal: 0, hasTaste: true };
      const item = { genres: ['Action','Fantasy'], format: 'TV', studios: { nodes: [{ name: 'ufotable' }] }, averageScore: 85, popularity: 1000 };
      const r = computeCandidateScore(item, profile, { maxPopularity: 1000 });
      check('선호 장르 고득점', r.score > 60);
      check('matched 2개', r.matched.length === 2);
      const cold = computeCandidateScore({ genres: ['Comedy'], format: 'TV', studios: { nodes: [] }, averageScore: 90, popularity: 2000 }, { ...profile, hasTaste: false }, { maxPopularity: 2000 });
      check('콜드스타트 fallback', cold.score > 50);
      const items = [{ id: 1, genres: ['Action'], format: 'TV', studios: { nodes: [] }, averageScore: 70, popularity: 100 }, { id: 2, genres: ['Action','Fantasy'], format: 'TV', studios: { nodes: [{ name: 'ufotable' }] }, averageScore: 85, popularity: 1000 }];
      const ranked = rankCandidates(items, profile);
      check('rankCandidates 1위 id=2', ranked[0].item.id === 2);
      const pool = Array.from({ length: 10 }, (_, i) => ({ item: { id: i, genres: [i % 2 ? 'Action' : 'Comedy'], averageScore: 70 + i, popularity: 100 }, score: 70 + i }));
      check('selectDiverse 4개', selectDiverse(pool, 4).length === 4);
      const m = recommendationMetrics(ranked, [ranked[0]]);
      check('metrics selectedCount', m.selectedCount === 1 && m.coverage > 0);
      summary.className = failures.length ? 'fail' : 'pass';
      summary.textContent = failures.length ? `실패 ${failures.length}건 / 전체 ${total}건` : `통과 ${total}건 / 전체 ${total}건`;
      window.__REC_RESULT__ = { total, failed: failures.length, failures };
      document.title = failures.length ? `FAIL ${failures.length}/${total}` : `PASS ${total}/${total}`;
    } catch (e) {
      summary.className = 'fail';
      summary.textContent = `실행 오류: ${e.message}`;
      window.__REC_RESULT__ = { total, failed: 1, failures: [e.message] };
      document.title = 'ERROR';
    }
  </script>
</body>
</html>
