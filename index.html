<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="ANIME HUB 홈">
        <span class="brand-mark">A<span>+</span></span>
        <span class="brand-name">ANIME<span>HUB</span><small>애니메이션 통합 데이터베이스</small></span>
      </a>
      <div class="top-search" role="search">
        <span class="search-symbol">⌕</span>

<datalist id="search-suggestions"></datalist>
        <kbd>↵</kbd>

      <div class="top-actions">

        <button class="icon-button" id="install-button" title="앱 설치" hidden>⇩</button>
        <button class="account-button" id="account-button" title="개인 데이터 및 계정 설정"><span class="avatar">U</span><span id="account-label">로컬 저장</span></button>
      </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="nav-label">탐색 메뉴</div>
        <nav id="main-nav" class="main-nav">
          <a href="#home" data-route="home" class="nav-item active"><span>⌂</span> 홈</a>
          <a href="#airing" data-route="airing" class="nav-item"><span>◷</span> 방영 일정</a>
          <a href="#browse" data-route="browse" class="nav-item"><span>▦</span> 전체 애니</a>
          <a href="#movies" data-route="movies" class="nav-item"><span>▣</span> 극장판 · 영화</a>
          <a href="#studios" data-route="studios" class="nav-item"><span>▤</span> 제작사</a>
          <a href="#people" data-route="people" class="nav-item"><span>♙</span> 성우 · 스태프</a>
        </nav>
        <div class="nav-label personal-label">나의 공간</div>
        <nav class="main-nav">
          <a href="#watchlist" data-route="watchlist" class="nav-item"><span>♡</span> 내 보관함</a>
          <a href="#recommend" data-route="recommend" class="nav-item"><span>✧</span> 취향 추천</a>

          <button class="settings-link" id="settings-open">⚙ 데이터·계정 설정</button>
          <p class="sidebar-note">작품 정보 제공: AniList / Jikan / TMDB<br/>한글 별칭 자동 조회 · TMDB 한국어 정보 선택 연결</p>
        </div>
      </aside>

      <main id="main-content" class="main-content">
        <section class="welcome-skeleton"><div class="skeleton wide"></div><div class="skeleton row"></div><div class="skeleton cards"></div></section>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="app.js"></script>

</html>
